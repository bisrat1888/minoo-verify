<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Menu</title>
<!-- model-viewer ቤተ-መጽሐፍት (Three.js ላይ የተመሠረተ) -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 640px; margin-inline: auto; }
  model-viewer { width: 100%; height: 420px; background: #eee; border-radius: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  input, button { font-size: 16px; padding: 10px; }
  button { background: #c0392b; color: #fff; border: 0; border-radius: 8px; }
  #status { color: #555; min-height: 1.4em; }
</style>
</head>
<body>
  <h2>3D Menu</h2>

  <!-- የሰርቨሩ አድራሻ (ስልክ ላይ ሲሞክሩ የኮምፒውተሩን IP ያስገቡ) -->
  <div class="row">
    <input id="api" value="http://localhost:8000" style="flex:1" aria-label="Server URL">
  </div>

  <!-- 3D ሞዴሉ የሚታይበት -->
  <model-viewer id="mv"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="30deg"
    interaction-prompt="auto"
    shadow-intensity="1"
    exposure="1.1"
    ar ar-modes="webxr scene-viewer quick-look"
    alt="3D food model">
  </model-viewer>

  <div class="row">
    <!-- 1) ፎቶ ጫን → 3D ፍጠር -->
    <input type="file" id="photo" accept="image/*">
    <button id="go">Generate 3D</button>
  </div>
  <div class="row">
    <!-- 2) ያለ ሰርቨር ለሙከራ: ዝግጁ .glb ፋይል ክፈት -->
    <label>Or test with a .glb file: <input type="file" id="glb" accept=".glb"></label>
  </div>
  <p id="status"></p>

<script>
  const mv = document.getElementById('mv');
  const statusEl = document.getElementById('status');

  // ዝግጁ .glb ፋይል በቀጥታ ማሳየት (ሰርቨር አያስፈልግም)
  document.getElementById('glb').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) { mv.src = URL.createObjectURL(f); statusEl.textContent = 'Loaded ' + f.name; }
  });

  // ፎቶውን ወደ ሰርቨር ልኮ የ3D ፋይል መቀበል
  document.getElementById('go').addEventListener('click', async () => {
    const file = document.getElementById('photo').files[0];
    if (!file) { statusEl.textContent = 'Choose a photo first.'; return; }

    const api = document.getElementById('api').value.replace(/\/$/, '');
    const body = new FormData();
    body.append('file', file);
    statusEl.textContent = 'Generating… this can take 30–120 seconds.';

    try {
      const res = await fetch(api + '/api/generate', { method: 'POST', body });
      if (!res.ok) throw new Error(await res.text());
      const { url } = await res.json();
      mv.src = api + url;   // ሞዴሉ ተጭኖ በራሱ መሽከርከር ይጀምራል
      statusEl.textContent = 'Done. Drag to rotate, pinch to zoom.';
    } catch (err) {
      statusEl.textContent = 'Error: ' + err.message;
    }
  });
</script>
</body>
</html>
